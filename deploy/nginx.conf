# Example nginx site for Sealdrop. Copy to /etc/nginx/conf.d/sealdrop.conf,
# replace drop.example.com and the certificate paths, then `nginx -t && nginx -s reload`.
#
# The app sets CSP / Referrer-Policy / Permissions-Policy / no-store itself, so they
# are deliberately NOT repeated here (duplicate headers would conflict). HSTS is set
# here because it only makes sense on the TLS-terminating hop.

limit_req_zone  $binary_remote_addr zone=sealdrop_api:10m    rate=30r/m;
limit_req_zone  $binary_remote_addr zone=sealdrop_create:10m rate=10r/h;
limit_conn_zone $binary_remote_addr zone=sealdrop_conn:10m;

upstream sealdrop {
    server 127.0.0.1:8480;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name drop.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drop.example.com;

    ssl_certificate     /etc/letsencrypt/live/drop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Privacy: no access log (it would record client IPs and secret ids in URLs).
    access_log off;

    # Largest request is a ~13 KB JSON body at the default 8 KB secret size.
    # Raise this if you raise MAX_SECRET_BYTES.
    client_max_body_size 24k;
    client_body_timeout   10s;
    client_header_timeout 10s;
    send_timeout          10s;
    limit_conn sealdrop_conn 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # OVERWRITE (not append) so clients cannot spoof their address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 15s;

    location = /api/drops {
        limit_req zone=sealdrop_create burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://sealdrop;
    }

    location /api/ {
        limit_req zone=sealdrop_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://sealdrop;
    }

    location / {
        proxy_pass http://sealdrop;
    }
}
